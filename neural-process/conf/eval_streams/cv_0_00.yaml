# @package _global_
#
# cv_0_00 eval-stream bundle — compose with `+cv_spec=cv_0_00 +eval_streams=cv_0_00`.
# NB: the `+` prefix is required — `eval_streams` is not (yet) in any defaults
# list, so the bare `eval_streams=cv_0_00` override raises a Hydra "no match in
# the defaults list" error.
# OOD validation via a `grouped_variety` carve (unseen genotypes), plus the
# two scenario subset probes the scheme grades: CV0 (seen variety, new env) and
# CV00 (new variety, new env), both PREDICT rows in the held-out env.
# Self-contained (full list — no list-inheritance).
#
# eval_tag: the monitor val-carve slug tag (root key; baked into model_slug /
# model_run_name so this carve is distinguishable from other carves in the
# artifact dir + W&B). KEEP IN SYNC with the val strategy below (grouped_variety
# n_groups=30 → gv30); survives eval.py's predict-mode eval_streams clearing.
eval_tag: "_val=gv30"
dataset:
  eval_streams:
    - name: val
      source: carve
      strategy: { name: grouped_variety, n_groups: 30 }   # OOD: unseen genotypes (~9% of a fold train pool)
      monitor: true
      monitor_metric: pearson_r     # PRIMARY → early stop + plateau LR + metrics.json
      monitor_mode: max
      # One best_<metric>.ckpt (+ best_frozen_<metric>.ckpt under freeze) per
      # entry; modes from the metric registry (rmse=min, others=max). Subset of
      # `metrics`. Omit → defaults to just [monitor_metric].
      checkpoint_metrics: [pearson_r, rmse, loglik]
      metrics: [rmse, pearson_r, spearman_r, loglik]
    - name: cv0                 # seen variety, new env (registered; scheme cv_0_00)
      source: observe
      selector: { name: cv0 }
      monitor: false
      metrics: [rmse, pearson_r, spearman_r, loglik]
    - name: cv00                # new variety, new env
      source: observe
      selector: { name: cv00 }
      monitor: false
      metrics: [rmse, pearson_r, spearman_r, loglik]
