# @package _global_
# Frequentist twin of env-GxE — K=5 VI FPCs (no weather; cf. weather-GxE).
#   GBLUP: REML variance components for
#          K_A + K_D + KG_GE_A + KG_GE_D + K_P + K_P_PE + K_env,
#   then BLUP/kriging predictions. Identical kernel stack to the
#   bglr fragment (fpca_eid_ga_gd_gaXeid_gdXeid_vi_viXeid_bglr_mse) — only
#   the regressor block differs, so the Bayesian-vs-frequentist
#   comparison is a single-token swap.
# Key choices (shared with the bglr twin):
#   - vi.k=5: vi_fpca.n_components=5 (phenomic KP + KP_PE inherit it).
#   - _uc: genomic K_A/K_D enter uncentered (the R reference's recipe).
#   - env BRR(Z_e) is folded into K_env = Z_e Z_eᵀ inside the GBLUP
#     regressor — the RKHS-equivalent of a ridge on the env one-hot.

# Unified slug grammar (alpha-sorted peers). Mirrors the bglr fragment's
# model_name with the regressor token swapped bglr → gblup.
model_name: fpca_eid_ga.rank=full.uc_gaXeid.rank=full_gd.rank=full.uc_gdXeid.rank=full_vi.t=${vi_time}.c=${vi_chan}${vi_aug}.k=5.s=wez.rank=full.uc_viXeid.rank=full_gblup_loss=mse

dataset:
  processing:
    metadata_features:
      enabled: true
      sources:
        - name: env_onehot
          column: Env.Year
    vi_fpca:
      enabled: true
      n_components: 5
    genomic:
      enabled: true
      # GRM recompute is ~1 min; the cache entry embeds the full 1180 x 238k
      # dosage matrix (~2 GB per key). Don't persist in train-only CV runs.
      persist_cache: false
      csv_path: ./dataset-files/g2f/G2F_2020_2021_Genomic_Data.csv
      center_kernel: false
      sources:
        - name: genomic_add
          type: additive_grm
        - name: genomic_dom
          type: dominance_grm
    phenomic:
      enabled: true
      # N x N derived kernel; only read back in predict mode. Don't write
      # ~1-2 GB per split to .cache in train-only CV runs (quota).
      persist_cache: false
      kernel: linear
      gamma: null
      center_kernel: false
      # K_P eigenbasis pools ALL envs: the kernel handed to the
      # transductive regressor spans train+test rows jointly (test
      # yields are masked in the fit — reference parity; the raw_kernel
      # path requires fit_scope: all). The VI FPCA basis upstream is
      # still train-only (basis-inductive policy).
      fit_scope: all
      sources:
        - name: phenomic_relmat
          type: phenomic_relmat
          scaling: within_env_zscore
    interaction:
      enabled: true
      # N x N derived kernel; only read back in predict mode. Don't write
      # ~1-2 GB per split to .cache in train-only CV runs (quota).
      persist_cache: false
      center_kernel: false
      # Transductive kernels over all rows (fit_scope: all — the
      # raw_kernel path requires it; reference parity), like the bglr twin.
      sources:
        - name: gxea
          type: interaction_relmat
          components: [genomic_add, env_onehot]
          fit_scope: all
        - name: gxed
          type: interaction_relmat
          components: [genomic_dom, env_onehot]
          fit_scope: all
        - name: pxe
          type: interaction_relmat
          components: [phenomic_relmat, env_onehot]
          fit_scope: all

regressor:
  name: gblup
  loss_name: mse
  # REML (sommer) controls. reml_max_iter bounds the variance-component
  # optimisation (sommer's `iters`); there is no Gibbs n_iter/burn_in.
  reml_max_iter: 40
  tol: 1.0e-4
  # Term order is informational for GBLUP (REML estimates all variance
  # components jointly; order does not affect the fit), but kept aligned
  # with the bglr twin's ETA order for readability.
  #   K_A, K_D, KG_GE_A, KG_GE_D, K_P, K_P_PE, then K_env (Z_e).
  feature_keys:
    - genomic_add
    - genomic_dom
    - gxea
    - gxed
    - phenomic_relmat
    - pxe
    - env_onehot
  env_brr_key: env_onehot
misc:
  # FPCA baselines emit a single test scalar per fold via metrics.json;
  # the wandb side-channel adds nothing the LOO aggregator can't read
  # from disk. Disable for fpca; flip to true if you need run-tracking.
  wandb_logging_enabled: false
  wandb_group: ${model_name}
  wandb_tags:
    - ${model_name}
    - "seed=${misc.seed}"
    - gblup
    - reml
    - frequentist-twin
    - modality-ablation
    - r-analog-env-gxe
    - interaction
    - vi_K=5
