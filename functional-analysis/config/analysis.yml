# Scientific analysis choices retained for the manuscript workflow.
# These values are version controlled; unlike config/paths.yml, they are not
# machine-specific.

weather:
  max_drone_dap: 161
  ptr_outlier_rule:
    direction: "upper"
    standard_deviation_multiplier: 3
  par_temp_outlier_rule:
    direction: "absolute"
    standard_deviation_multiplier: 3
  station_air_temperature:
    - {environment: "MOH1.2020", min_dap: null, max_dap: 115}
    - {environment: "TXH1.2020", min_dap: 52, max_dap: 138}
    - {environment: "TXH2.2020", min_dap: 58, max_dap: 138}
    - {environment: "TXH3.2020", min_dap: 25, max_dap: 110}
    - {environment: "WIH1.2021", min_dap: 35, max_dap: null}
    - {environment: "WIH2.2021", min_dap: 3, max_dap: null}
    - {environment: "WIH3.2020", min_dap: 13, max_dap: null}
  station_soil_temperature:
    hampel:
      environments:
        - "MOH1.2020"
        - "TXH1.2020"
        - "TXH1.2021"
        - "TXH2.2020"
        - "TXH2.2021"
        - "TXH3.2020"
        - "TXH3.2021"
        - "WIH1.2021"
        - "WIH2.2021"
      k: 6
      t0: 1
    dap_windows:
      - {environment: "TXH1.2020", min_dap: 52, max_dap: null}
      - {environment: "TXH1.2021", min_dap: 45, max_dap: null}
      - {environment: "TXH2.2020", min_dap: 61, max_dap: null}
      - {environment: "TXH3.2020", min_dap: 27, max_dap: null}
      - {environment: "TXH3.2021", min_dap: 14, max_dap: null}
      - {environment: "WIH1.2021", min_dap: 49, max_dap: null}
      - {environment: "WIH2.2021", min_dap: 7, max_dap: null}

drone:
  environments:
    - "DEH1.2020"
    - "IAH4.2021"
    - "MIH1.2020"
    - "MNH1.2020"
